<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>I've made $3M with my 36 startups — Marc Lou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --gold: #e4b84a;
      --gold-dim: #c49a32;
      --ink: #100e0c;
      --bg: #161310;
      --panel: #1e1a16;
      --line: rgba(244, 236, 222, 0.1);
      --text: #f3ece1;
      --muted: #9b9286;
      --quiet: #6f675d;
      --play: #111;
      --radius: 14px;
      --dock-h: 7.6rem;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ink); color: var(--text); }
    body {
      font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      min-height: 100dvh;
      background:
        radial-gradient(1200px 520px at 50% -10%, #2a2218 0%, transparent 62%),
        var(--ink);
    }
    button { font-family: inherit; }
    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.25rem calc(var(--dock-h) + 2.2rem);
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin: 0 0 1.35rem;
      color: var(--gold);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .kicker::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    header.hero {
      display: grid;
      grid-template-columns: 156px minmax(0, 1fr);
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 1.6rem;
    }
    .cover-wrap {
      width: 156px;
      aspect-ratio: 5 / 8;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    }
    .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero h1 {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(1.45rem, 3.6vw, 2.15rem);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -.02em;
      margin: 0 0 .55rem;
      overflow-wrap: break-word;
    }
    .byline {
      margin: 0 0 .35rem;
      color: var(--text);
      font-size: 1rem;
      font-weight: 500;
    }
    .meta {
      margin: 0 0 .7rem;
      color: var(--muted);
      font-size: .88rem;
    }
    .legal {
      margin: 0;
      color: var(--quiet);
      font-size: .8rem;
      line-height: 1.45;
      max-width: 36em;
    }

    .stage {
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      margin: 0 0 1.75rem;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    video { width: 100%; height: auto; display: block; background: #000; cursor: pointer; }

    .section-label {
      margin: 0 0 .7rem;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--quiet);
    }
    .chapters {
      border-top: 1px solid var(--line);
    }
    .ch {
      display: grid;
      grid-template-columns: 2.1rem 1fr auto;
      gap: .85rem;
      align-items: baseline;
      width: 100%;
      padding: .82rem 0;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-align: left;
      cursor: pointer;
      border-radius: 0;
    }
    .ch:hover .ch-title { color: var(--gold); }
    .ch.active .ch-title { color: var(--gold); }
    .ch.active { background: linear-gradient(90deg, rgba(228,184,74,.07), transparent 42%); }
    .ch .n {
      color: var(--quiet);
      font-variant-numeric: tabular-nums;
      font-size: .86rem;
    }
    .ch.active .n { color: var(--gold); }
    .ch-title { font-size: .98rem; font-weight: 500; }
    .ch .dur {
      color: var(--quiet);
      font-variant-numeric: tabular-nums;
      font-size: .86rem;
    }

    .files {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: .35rem 1.1rem;
      color: var(--quiet);
      font-size: .82rem;
    }
    .files a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .files a:hover { color: var(--gold); border-bottom-color: var(--gold-dim); }

    .dock {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: rgba(16,14,12,.88);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border-top: 1px solid var(--line);
      padding: .7rem 1rem calc(.85rem + env(safe-area-inset-bottom));
    }
    .dock-inner { max-width: 760px; margin: 0 auto; }
    .now-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-bottom: .35rem;
    }
    .now {
      min-width: 0;
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now b { color: var(--text); font-weight: 600; }
    .ch-nav { display: flex; gap: .25rem; flex-shrink: 0; }
    .icon-btn, .play, .speed-btn {
      border: 0;
      cursor: pointer;
      color: var(--text);
      background: transparent;
    }
    .icon-btn {
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }
    .icon-btn:hover { background: rgba(255,255,255,.06); }
    .icon-btn svg { width: 22px; height: 22px; display: block; }
    .icon-btn.skip {
      width: 2.7rem;
      height: 2.7rem;
      flex-direction: column;
      gap: 0;
      font-size: .58rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--text);
    }
    .icon-btn.skip svg { width: 18px; height: 18px; }
    .play {
      width: 3rem;
      height: 3rem;
      border-radius: 999px;
      background: var(--gold);
      color: var(--play);
      display: grid;
      place-items: center;
    }
    .play:hover { background: #f0c65a; }
    .play svg { width: 18px; height: 18px; display: block; }
    .transport {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: .85rem 1rem;
      align-items: center;
    }
    .arrows {
      display: flex;
      align-items: center;
      gap: .15rem;
    }
    .seek-wrap {
      display: flex;
      align-items: center;
      gap: .7rem;
      min-width: 0;
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 99px;
      background: #3a342e;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--gold);
      border: 0;
      box-shadow: 0 0 0 3px rgba(228,184,74,.18);
    }
    .times {
      font-variant-numeric: tabular-nums;
      color: var(--quiet);
      font-size: .78rem;
      flex-shrink: 0;
      min-width: 7.4rem;
      text-align: right;
    }
    .speed { position: relative; }
    .speed-btn {
      min-width: 3.4rem;
      height: 2.15rem;
      padding: 0 .7rem;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      font-size: .82rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .25rem;
    }
    .speed-btn:hover, .speed.open .speed-btn { background: rgba(228,184,74,.16); color: var(--gold); }
    .speed-menu {
      display: none;
      position: absolute;
      right: 0;
      bottom: calc(100% + 10px);
      min-width: 7.2rem;
      padding: .35rem;
      background: #2a241e;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
      z-index: 5;
    }
    .speed.open .speed-menu { display: grid; }
    .speed-menu button {
      border: 0;
      background: none;
      color: var(--text);
      text-align: left;
      padding: .5rem .7rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: .9rem;
      font-variant-numeric: tabular-nums;
    }
    .speed-menu button:hover { background: rgba(255,255,255,.06); }
    .speed-menu button.on {
      background: rgba(228,184,74,.16);
      color: var(--gold);
      font-weight: 600;
    }
    .caps {
      margin-top: .55rem;
      min-height: 1.35rem;
      text-align: center;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 1.02rem;
      line-height: 1.35;
      color: var(--quiet);
    }
    .caps .w { color: #7d756b; }
    .caps .w.on { color: var(--gold); }

    .icon-btn:focus-visible,
    .play:focus-visible,
    .speed-btn:focus-visible,
    .ch:focus-visible,
    .speed-menu button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    @media (max-width: 640px) {
      .app { padding: 1.25rem 1rem calc(var(--dock-h) + 2.8rem); }
      header.hero { grid-template-columns: 92px minmax(0, 1fr); gap: 1rem; }
      .cover-wrap { width: 92px; }
      .hero h1 { font-size: 1.28rem; }
      .transport {
        grid-template-columns: 1fr auto;
        grid-template-areas: "arrows speed" "seek seek";
        gap: .45rem .5rem;
      }
      .arrows { grid-area: arrows; }
      .speed { grid-area: speed; align-self: center; }
      .seek-wrap { grid-area: seek; gap: .4rem; }
      .times { min-width: 6.6rem; font-size: .72rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <p class="kicker">A gift for Marc Lou</p>
    <header class="hero">
      <div class="cover-wrap">
        <img class="cover" src="assets/cover.png" alt="Book cover: I've made $3M with my 36 startups">
      </div>
      <div>
        <h1>I've made $3M with my 36 startups</h1>
        <p class="byline">Marc Lou</p>
        <p class="meta">Audiobook · 25 min · 14 chapters</p>
        <p class="legal">Fan project. Read by a voice clone of Marc Lou — not by Marc himself.</p>
      </div>
    </header>

    <div class="stage">
      <video id="media" playsinline webkit-playsinline preload="metadata" poster="assets/poster.png">
        <source src="video/marc-lou-36-startups.mp4" type="video/mp4">
      </video>
    </div>

    <h2 class="section-label">Chapters</h2>
    <div class="chapters" id="list"></div>

    <div class="files">
      <a href="full/full-book.mp3">MP3</a>
      <a href="full/full-book.m4b">M4B</a>
      <a href="video/marc-lou-36-startups.mp4">Video</a>
      <a href="captions/full-book.vtt">Captions</a>
    </div>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <div class="now-row">
        <div class="now" id="now">Loading…</div>
        <div class="ch-nav">
          <button class="icon-btn" id="prev" title="Previous chapter" aria-label="Previous chapter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button class="icon-btn" id="next" title="Next chapter" aria-label="Next chapter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="transport">
        <div class="arrows">
          <button class="icon-btn skip" id="back" title="Back 15 seconds" aria-label="Back 15 seconds">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-6-5 6-5"/><path d="M19 17l-6-5 6-5"/></svg>
            15
          </button>
          <button class="play" id="play" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.8v12.4L19 12 8 5.8z"/></svg>
          </button>
          <button class="icon-btn skip" id="fwd" title="Forward 10 seconds" aria-label="Forward 10 seconds">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7l6 5-6 5"/><path d="M5 7l6 5-6 5"/></svg>
            10
          </button>
        </div>
        <div class="seek-wrap">
          <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
          <span class="times" id="times">0:00 / 0:00</span>
        </div>
        <div class="speed" id="speed">
          <button class="speed-btn" id="speedBtn" aria-haspopup="listbox" aria-expanded="false">1×</button>
          <div class="speed-menu" id="speedMenu" role="listbox" aria-label="Playback speed"></div>
        </div>
      </div>
      <div class="caps" id="caps"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const media = $('media');
    const RATES = [0.8, 1, 1.25, 1.5, 1.75, 2];
    const PLAY = '<path d="M8 5.8v12.4L19 12 8 5.8z"/>';
    const PAUSE = '<path d="M7 6h3.2v12H7V6zm6.8 0H17v12h-3.2V6z"/>';
    let manifest = null, words = [], chapterIdx = 0, rate = 1;

    const fmt = (s) => {
      s = Math.max(0, s|0);
      const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), r = s%60;
      return (h ? h + ':' : '') + String(m).padStart(h?2:1,'0') + ':' + String(r).padStart(2,'0');
    };
    function chapterAt(t) {
      let i = 0;
      for (let n = 0; n < manifest.chapters.length; n++) {
        if (t + 0.05 >= (manifest.chapters[n].start_s || 0)) i = n;
      }
      return i;
    }
    function setChapter(i, seek=true) {
      chapterIdx = Math.max(0, Math.min(manifest.chapters.length - 1, i));
      const ch = manifest.chapters[chapterIdx];
      const n = ch.number === 0 ? 'Opening' : 'Chapter ' + ch.number;
      $('now').innerHTML = n + '  ·  <b>' + ch.title + '</b>';
      [...document.querySelectorAll('.ch')].forEach((el, n) => el.classList.toggle('active', n===chapterIdx));
      if (seek) media.currentTime = ch.start_s || 0;
    }
    function applyRate(r) {
      rate = r;
      media.playbackRate = r;
      try { localStorage.setItem('marc-audiobook-rate', String(r)); } catch (e) {}
      $('speedBtn').textContent = (r === 1 ? '1×' : r + '×');
      [...document.querySelectorAll('#speedMenu button')].forEach(b => {
        b.classList.toggle('on', Number(b.dataset.r) === r);
      });
    }
    function closeSpeed() {
      $('speed').classList.remove('open');
      $('speedBtn').setAttribute('aria-expanded', 'false');
    }
    function renderSpeeds() {
      $('speedMenu').innerHTML = RATES.map(r =>
        `<button role="option" data-r="${r}">${r === 1 ? '1×' : r + '×'}</button>`
      ).join('');
      $('speedBtn').onclick = (e) => {
        e.stopPropagation();
        const open = $('speed').classList.toggle('open');
        $('speedBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      $('speedMenu').onclick = (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        applyRate(Number(b.dataset.r));
        closeSpeed();
      };
      document.addEventListener('click', (e) => {
        if (!$('speed').contains(e.target)) closeSpeed();
      });
    }
    function renderList() {
      $('list').innerHTML = manifest.chapters.map((ch, i) => `
        <button class="ch" data-i="${i}">
          <span class="n">${ch.number === 0 ? '—' : String(ch.number).padStart(2,'0')}</span>
          <span class="ch-title">${ch.title}</span>
          <span class="dur">${fmt(ch.duration_s)}</span>
        </button>`).join('');
      $('list').onclick = (e) => {
        const row = e.target.closest('.ch');
        if (row) { setChapter(+row.dataset.i, true); media.play(); }
      };
    }
    function updateCaps() {
      const abs = media.currentTime;
      let i = 0;
      while (i < words.length && words[i].end < abs - 0.04) i++;
      if (!words[i]) { $('caps').innerHTML = ''; return; }
      const line = [words[i]];
      for (let j = i - 1; j >= 0 && line.length < 8; j--) {
        if (words[j + 1].start - words[j].end > 0.28) break;
        line.unshift(words[j]);
      }
      for (let j = i + 1; j < words.length && line.length < 8; j++) {
        if (words[j].start - line[line.length - 1].end > 0.28) break;
        if (words[j].end - line[0].start > 3.4) break;
        line.push(words[j]);
      }
      $('caps').innerHTML = line.map(w => {
        const on = abs >= w.start && abs <= w.end + 0.05;
        return `<span class="w${on ? ' on' : ''}">${w.word}</span>`;
      }).join(' ');
    }
    function setSeekFill() {
      const el = $('seek');
      const pct = (el.value / el.max) * 100;
      el.style.background = `linear-gradient(to right, var(--gold) ${pct}%, #3a342e ${pct}%)`;
    }
    function skip(delta) {
      media.currentTime = Math.max(0, Math.min(totalDur(), media.currentTime + delta));
    }

    function totalDur() {
      return media.duration || (manifest && manifest.duration_s) || 0;
    }
    media.ontimeupdate = () => {
      const d = totalDur();
      if (!d) return;
      $('seek').value = (media.currentTime / d) * 1000;
      $('times').textContent = fmt(media.currentTime) + ' / ' + fmt(d);
      setSeekFill();
      const i = chapterAt(media.currentTime);
      if (i !== chapterIdx) setChapter(i, false);
      updateCaps();
    };
    media.ondurationchange = () => {
      $('times').textContent = fmt(media.currentTime) + ' / ' + fmt(totalDur());
    };
    media.onratechange = () => { if (media.playbackRate !== rate) applyRate(media.playbackRate); };
    $('play').onclick = () => { if (media.paused) media.play(); else media.pause(); };
    media.onclick = () => { if (media.paused) media.play(); else media.pause(); };
    media.onplay = () => {
      $('play').setAttribute('aria-label', 'Pause');
      $('playIcon').innerHTML = PAUSE;
    };
    media.onpause = () => {
      $('play').setAttribute('aria-label', 'Play');
      $('playIcon').innerHTML = PLAY;
    };
    $('back').onclick = () => skip(-15);
    $('fwd').onclick = () => skip(10);
    $('prev').onclick = () => setChapter(chapterIdx - 1, true);
    $('next').onclick = () => setChapter(chapterIdx + 1, true);
    $('seek').oninput = () => {
      const d = totalDur();
      if (d) media.currentTime = ($('seek').value/1000) * d;
      setSeekFill();
    };
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
      if (e.code === 'ArrowLeft') { e.preventDefault(); skip(-15); }
      if (e.code === 'ArrowRight') { e.preventDefault(); skip(10); }
      if (e.code === 'Escape') closeSpeed();
    });
    renderSpeeds();
    Promise.all([
      fetch('manifest.json').then(r => r.json()),
      fetch('captions/words.json').then(r => r.json()).catch(() => ({words:[]}))
    ]).then(([m, w]) => {
      manifest = m;
      words = w.words || [];
      renderList();
      setChapter(0, false);
      let saved = 1;
      try { saved = Number(localStorage.getItem('marc-audiobook-rate') || 1); } catch (e) {}
      applyRate(RATES.includes(saved) ? saved : 1);
      $('times').textContent = '0:00 / ' + fmt(totalDur());
      setSeekFill();
    });
  </script>
</body>
</html>
